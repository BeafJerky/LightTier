<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="/favicon.ico" rel="icon" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- 字体文件由 gstatic 提供，预连接可减少首次字体请求的握手耗时 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Quicksand:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- <script src="https://unpkg.com/default-passive-events" type="text/javascript"></script> -->
    <title><%= title %></title>
    <!-- 首屏主题引导：外部同步脚本，配合严格 CSP（script-src 'self'，禁止内联） -->
    <script src="/theme-init.js"></script>
    <!-- 首屏加载动画：必须用外部样式表。内联 <style> 会让 Tauri 注入 style nonce，
         按 CSP 规范这会使 'unsafe-inline' 失效，Monaco 等运行时注入的样式将被拦截 -->
    <link rel="stylesheet" href="/loading.css" />
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading-wrap">
          <div class="app-loading-brand">
            <img alt="Logo" class="app-loading-logo" src="/logo.png" />
            <div class="app-loading-title"><%= title %></div>
          </div>
          <div class="app-loading-item">
            <div class="app-loading-outter"></div>
            <div class="app-loading-inner"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
