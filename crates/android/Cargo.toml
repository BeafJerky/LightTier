[package]
name = "lighttier-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightTier Android 平台能力：进程内内核、RPC 与 VPN"

[target.'cfg(target_os = "android")'.dependencies]
# EasyTier kernel embedded as a library (Android 10+ cannot spawn private-dir binaries).
# Tag pins the in-process Android kernel version (desktop kernels are downloaded at runtime).
easytier = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.6.4" }
# Vendored copy of EasyTier's tauri-plugin-vpnservice (see android/tauri-plugin-vpnservice/).
tauri-plugin-vpnservice = { path = "../../android/tauri-plugin-vpnservice" }
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2.10.3"
# Kernel integration helpers (versions aligned with the easytier crate).
tokio = { version = "1", features = ["full"] }
once_cell = "1.20"
uuid = { version = "1", features = ["v4"] }
humansize = "2.1.3"
