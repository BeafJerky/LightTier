[package]
authors = ["cheng"]
description = "LightTier"
edition = "2021"
license = ""
name = "lighttier"
repository = ""
rust-version = "1.92.0"
version = "1.8.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "app_lib"

[build-dependencies]
tauri-build = { version = "2.5.6", features = ["config-json5"] }

[dependencies]
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.3", features = [
    "tray-icon",
    "image-ico",
    "image-png",
    "config-json5",
    # "devtools"
] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.3.2"
tauri-plugin-http = "2.5.8"
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.2"
chrono = "0.4.44"

# 生产构建必须启用（官方模板要求的 DO NOT REMOVE 特性）：未启用时 tauri 按 dev 模式编译
# （tauri build.rs：dev = !custom-protocol），Android 端资源请求会被代理到 devUrl，
# 手机无 dev server 时白屏报 "Failed to request http://localhost:4000/"。手动打包见 lt-android-repack.ps1。
[features]
custom-protocol = ["tauri/custom-protocol"]

# [profile.dev]
# incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-prevent-default = "4"

[target.'cfg(target_os = "android")'.dependencies]
# EasyTier kernel embedded as a library (Android 10+ cannot spawn private-dir binaries).
# Tag pins the in-process Android kernel version (desktop kernels are downloaded at runtime).
easytier = { git = "https://github.com/EasyTier/EasyTier.git", tag = "v2.6.4" }
# Vendored copy of EasyTier's tauri-plugin-vpnservice (see tauri-plugin-vpnservice/).
tauri-plugin-vpnservice = { path = "../tauri-plugin-vpnservice" }
# Kernel integration helpers (versions aligned with the easytier crate).
tokio = { version = "1", features = ["full"] }
once_cell = "1.20"
uuid = { version = "1", features = ["v4"] }
humansize = "2.1.3"

[patch.crates-io]
# proc-macro-crate v2.0.2 pins `toml_datetime = "=0.6.3"` (pulled in via the gtk/glib
# Linux dependency chain), which conflicts with easytier's `toml ^0.8.12`
# (requiring toml_datetime ^0.6.5). Cargo resolves one version per 0.6.x semver
# series across all platforms, including Windows/Android builds.
#
# The vendor copy at vendor/proc-macro-crate relaxes the pin to `toml_datetime ^0.6`.
# Track upstream fix: https://github.com/Boshen/proc-macro-crate/issues/18
# TODO: Remove this patch once proc-macro-crate >= v2.1.0 is published with the fix,
#       then delete the vendor/proc-macro-crate directory.
proc-macro-crate = { path = "vendor/proc-macro-crate" }
