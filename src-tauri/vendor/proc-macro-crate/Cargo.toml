[package]
name = "proc-macro-crate"
version = "2.0.2"
authors = ["Bastian Köcher <git@kchr.de>"]
edition = "2021"
categories = ["development-tools::procedural-macro-helpers"]
documentation = "https://docs.rs/proc-macro-crate"
repository = "https://github.com/bkchr/proc-macro-crate"
keywords = ["macro-rules", "crate", "macro", "proc-macro"]
license = "MIT OR Apache-2.0"
description = """
Replacement for crate (macro_rules keyword) in proc-macros
"""
readme = "./README.md"
rust-version = "1.66.0"

# Vendored copy of proc-macro-crate v2.0.2 with a relaxed toml_datetime pin:
# upstream pins `toml_datetime = "=0.6.3"`, which conflicts with easytier's
# `toml ^0.8.12` requirement of `toml_datetime ^0.6.5` during Cargo's
# cross-platform lockfile resolution. Caret semantics keep 0.6.3 compatibility.
[dependencies]
toml_edit = "=0.20.2"
toml_datetime = "^0.6.3"
